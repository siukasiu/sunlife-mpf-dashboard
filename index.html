<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>永明強積金 19 隻基金動態儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/80 p-6 rounded-2xl border border-slate-700/50 backdrop-blur">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
        永明強積金 (Sun Life MPF) 表現儀表板
      </h1>
      <p class="text-xs md:text-sm text-slate-400 mt-1">
        追蹤旗下全部 19 隻基金表現 • 最後更新：<span id="update-time" class="text-amber-400 font-mono">載入中...</span>
      </p>
    </div>

    <!-- 時間跨度選擇按鈕 -->
    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700/60">
      <button onclick="setPeriod('w1')" id="btn-w1" class="px-4 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-lg">1 星期</button>
      <button onclick="setPeriod('m1')" id="btn-m1" class="px-4 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white">1 個月</button>
      <button onclick="setPeriod('y1')" id="btn-y1" class="px-4 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white">1 年</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto space-y-8">
    <!-- 折線/柱狀對比圖 -->
    <section class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700/50 shadow-xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> 19 隻基金表現總覽
        </h2>
        <span id="chart-period-label" class="text-xs text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/20">1 星期表現 (%)</span>
      </div>
      <div class="h-72 md:h-96 w-full">
        <canvas id="performanceChart"></canvas>
      </div>
    </section>

    <!-- 基金數據卡片網格 -->
    <section>
      <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span> 基金卡片細項
      </h2>
      <div id="funds-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <script>
    let rawData = null;
    let currentPeriod = 'w1';
    let myChart = null;

    async function loadData() {
      try {
        const res = await fetch('data.json');
        rawData = await res.json();
        document.getElementById('update-time').innerText = rawData.updated_at;
        render();
      } catch (e) {
        document.getElementById('update-time').innerText = '載入數據中...';
      }
    }

    function setPeriod(period) {
      currentPeriod = period;
      ['w1', 'm1', 'y1'].forEach(p => {
        const btn = document.getElementById(`btn-${p}`);
        btn.className = (p === period) 
          ? 'px-4 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-lg'
          : 'px-4 py-2 text-xs md:text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white';
      });
      const labels = { 'w1': '1 星期表現 (%)', 'm1': '1 個月表現 (%)', 'y1': '1 年表現 (%)' };
      document.getElementById('chart-period-label').innerText = labels[period];
      render();
    }

    function render() {
      if (!rawData) return;
      const funds = rawData.funds;

      // 渲染卡片
      document.getElementById('funds-grid').innerHTML = funds.map(f => {
        const val = f[currentPeriod];
        const isPos = val >= 0;
        const colorClass = isPos ? 'text-emerald-400' : 'text-rose-400';
        const bgBadge = isPos ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-rose-500/10 border-rose-500/20';

        return `
          <div class="bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 p-5 rounded-xl transition-all shadow-md">
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-700 text-slate-300">${f.category}</span>
              <span class="text-xs text-slate-400 font-mono">NAV: $${f.nav.toFixed(2)}</span>
            </div>
            <h3 class="font-bold text-slate-100 mb-4 text-sm md:text-base line-clamp-1">${f.name}</h3>
            <div class="flex justify-between items-end pt-2 border-t border-slate-700/40">
              <span class="text-xs text-slate-400">當前累積變動</span>
              <span class="text-lg font-bold font-mono px-2.5 py-0.5 rounded border ${colorClass} ${bgBadge}">
                ${isPos ? '+' : ''}${val.toFixed(2)}%
              </span>
            </div>
          </div>
        `;
      }).join('');

      // 渲染圖表
      const ctx = document.getElementById('performanceChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: funds.map(f => f.name.replace('永明強積金', '')),
          datasets: [{
            data: funds.map(f => f[currentPeriod]),
            backgroundColor: funds.map(f => f[currentPeriod] >= 0 ? '#10b981' : '#f43f5e'),
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
